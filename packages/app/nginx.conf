server {
    listen 80;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /import-notion {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /attachments/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx:alpine's mime.types has no .webmanifest entry; set it here only for
    # this file so we don't clobber the global MIME map (which would break sw.js).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Never cache the service worker — the browser must always check for updates
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # The shell, like the service worker, must always be revalidated. Without a
    # Cache-Control header nginx sends only Last-Modified, and the browser is
    # free to apply heuristic freshness — which means an HTTP-cached index.html
    # pointing at the previous build's hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed filenames; a given URL never changes content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # llms.txt is markdown for agents, not a generic text file — nginx's default
    # mime.types maps .txt to text/plain. Declare the type on this path only, and
    # append the UTF-8 charset the markdown carries (charset_types defaults to
    # text/html, so text/markdown must be named explicitly).
    location = /llms.txt {
        types { text/markdown txt; }
        charset_types text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    # The SPA shell is the answer to the app's client-side routes — extensionless
    # paths like /workspaces or /settings/acme. A path that names a file (a dot in
    # its last segment) but matches nothing on disk is a document the app does not
    # have, and answering it with the shell shipped a 200 index.html — which is
    # how /llms.txt silently returned the SPA before it became a real static file
    # (NOT-182). It gets an honest 404 instead.
    location @spa {
        if ($uri ~* "\.[^/]+$") {
            return 404;
        }

        rewrite ^ /index.html last;
    }
}
