services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    volumes:
      - notion-alt-data:/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    # healthcheck:
    #   test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 15s
    #   retries: 3

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - server

volumes:
  notion-alt-data:
