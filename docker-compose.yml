services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    volumes:
      - notion-alt-data:/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - BETTER_AUTH_SECRET
      - BASE_URL
      - TRUSTED_ORIGINS
      - PORT
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM
      - SMTP_SECURE
      - ADMIN_EMAILS
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - S3_BUCKET
      - S3_REGION
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_ENDPOINT
    # healthcheck:
    #   test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 15s
    #   retries: 3

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    restart: unless-stopped
    depends_on:
      - server

volumes:
  notion-alt-data:
