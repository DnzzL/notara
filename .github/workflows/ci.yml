name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push supersedes the in-flight run instead of queueing another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      # --ignore-scripts is belt and braces: the repo has no postinstall and no
      # trustedDependencies, so no dependency runs code at install time. The
      # msgpackr patch is applied explicitly — see CONTRIBUTING.md.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply-patches

      # @notara/shared is consumed as built output by app and server.
      - run: bun run --filter @notara/shared build

      # Vite build otherwise only runs in the release Docker build.
      - name: build app
        run: bun run --filter @notara/app build

      - name: typecheck (src)
        run: bun typecheck
      - name: typecheck (tests + e2e)
        run: bunx tsc --noEmit -p tsconfig.tests.json

      - name: lint
        run: bun lint
      - name: effect error channels
        run: bash scripts/check-effect-errors.sh

      - name: test
        run: bun run test

  # A test suite nobody runs is worse than no suite: it looks like coverage on
  # the dashboard while protecting nothing. This one was in that state — the
  # chromium project could not start locally, and CI never invoked Playwright at
  # all, so specs there had been executed by nobody for as long as they existed.
  #
  # Separate job so a browser download does not sit in front of the type-check
  # and unit tests, which are what most pushes are waiting on.
  #
  # Runs in the official Playwright image: browsers and system deps are baked
  # in, so nothing is fetched from Ubuntu mirrors at run time (a DNS outage
  # there once blocked every PR). The tag must match @playwright/test in
  # bun.lock; the "image tag" step fails the job if they drift.
  e2e:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      # setup-bun needs `unzip`, which the image lacks (and apt is what we avoid):
      # take bun from npm, Node being in the image.
      - run: npm install -g bun

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply-patches
      - run: bun run --filter @notara/shared build

      - name: image tag matches @playwright/test
        run: |
          v=$(sed -n 's/.*"@playwright\/test@\([^"]*\)".*/\1/p' bun.lock | head -1)
          grep -q "playwright:v$v-noble" .github/workflows/ci.yml

      - name: e2e
        run: bunx playwright test
        env:
          # The server refuses to start without it, and it need not be the real
          # one: nothing here outlives the job.
          BETTER_AUTH_SECRET: ci-secret-for-ephemeral-e2e-runs-only

      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # reporter "list" writes no playwright-report/; the actual/diff
          # screenshots of a failed visual test land in test-results/.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
