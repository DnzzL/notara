name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Build shared package
        run: bun run --filter @notara/shared build

      - name: Type-check all packages
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/tsconfig.json" ]; then
              echo "::group::Type-check $pkg"
              (cd "$pkg" && bunx tsc --noEmit) || FAILED=1
              echo "::endgroup::"
            fi
          done
          [ -z "${FAILED:-}" ]

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Build shared package
        run: bun run --filter @notara/shared build

      - name: Run server tests with coverage
        working-directory: packages/server
        run: bash ../../scripts/check-coverage.sh "@notara/server" . bun test

      - name: Run app tests with coverage
        working-directory: packages/app
        run: bash ../../scripts/check-coverage.sh "@notara/app" . bun test

      - name: Run electron tests with coverage
        working-directory: packages/electron
        run: bash ../../scripts/check-coverage.sh "@notara/electron" . bun test

      - name: Run shared tests with coverage
        working-directory: packages/shared
        run: bash ../../scripts/check-coverage.sh "@notara/shared" . bunx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Run Biome lint + format check
        run: bunx biome ci packages/ e2e/

      - name: Check Effect error handling in Zustand stores
        run: bash scripts/check-effect-errors.sh

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Build shared package
        run: bun run --filter @notara/shared build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: bunx playwright test
        env:
          BETTER_AUTH_SECRET: dummy-secret-for-ci

      - name: Run BDD (Cucumber) specs
        run: bun run bdd
        env:
          BETTER_AUTH_SECRET: dummy-secret-for-ci

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Check bundle sizes
        run: bash scripts/check-bundle-size.sh
        env:
          BETTER_AUTH_SECRET: dummy-secret-for-ci

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Build shared package
        run: bun run --filter @notara/shared build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run performance regression tests
        run: bunx playwright test e2e/performance-regression.spec.ts --project=chromium
        env:
          BETTER_AUTH_SECRET: dummy-secret-for-ci

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply runtime patches
        run: bun run apply-patches

      - name: Build shared package
        run: bun run --filter @notara/shared build

      - name: Install Chromium for Lighthouse
        run: bunx playwright install chromium

      - name: Run Lighthouse CI audit
        run: npx --no-install lhci autorun --config=.lighthouserc.json
        env:
          BETTER_AUTH_SECRET: dummy-secret-for-ci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/lighthouse/
          retention-days: 30

  merge-gate:
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        type-check,
        unit-tests,
        e2e-tests,
        bundle-size,
        performance,
        lighthouse,
      ]
    if: always()
    steps:
      - run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type-check: ${{ needs.type-check.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "E2E tests: ${{ needs.e2e-tests.result }}"
          echo "Bundle size: ${{ needs.bundle-size.result }}"
          echo "Performance: ${{ needs.performance.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.bundle-size.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ] || \
             [ "${{ needs.lighthouse.result }}" != "success" ]; then
            echo "❌ Merge blocked: one or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed — ready to merge"
